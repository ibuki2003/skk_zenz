[package]
name = "skk-zenz-bench"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.41", features = ["derive"] }
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"] }
llama-cpp-2 = "0.1.152"
skk-zenz-backend = { path = "../skk-zenz-backend" }
unicode-width = "0.2.2"

[features]
cuda = ["llama-cpp-2/cuda", "skk-zenz-backend/cuda"]
vulkan = ["llama-cpp-2/vulkan", "skk-zenz-backend/vulkan"]
